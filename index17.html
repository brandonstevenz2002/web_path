<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formato — Prueba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --bg-elevated: #1a222d;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f4f8;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --success: #34d399;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
            --font: "DM Sans", system-ui, -apple-system, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.25), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(52, 211, 153, 0.08), transparent);
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 4rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent-hover);
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            margin-bottom: 1rem;
        }

        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .lead {
            margin: 0 0 2rem;
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 42ch;
        }

        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .card-title {
            margin: 0 0 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        input:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(255, 255, 255, 0.06);
        }

        button[type="submit"] {
            margin-top: 0.5rem;
            padding: 0.85rem 1.5rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        button[type="submit"]:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            box-shadow: var(--shadow);
        }

        .table-header {
            padding: 1.25rem 1.75rem 0;
        }

        .table-header h2 {
            margin: 0 0 0.25rem;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .table-header p {
            margin: 0 0 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9375rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
        }

        th {
            padding: 0.875rem 1.75rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem 1.75rem;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.06);
        }

        td:first-child {
            font-weight: 500;
        }

        .stack-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem;
            font-size: 0.8125rem;
            font-weight: 500;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
        }

        .stack-tag--fe {
            color: #7dd3fc;
            border-color: rgba(125, 211, 252, 0.25);
            background: rgba(125, 211, 252, 0.08);
        }

        .stack-tag--be {
            color: #a5b4fc;
            border-color: rgba(165, 180, 252, 0.25);
            background: rgba(165, 180, 252, 0.08);
        }
    </style>
</head>
<body>
    <main class="page">
        <span class="badge">Registro</span>
        <h1>Prueba</h1>
        <p class="lead">Diligencia el siguiente formato para iniciar la prueba.</p>

        <section class="card" aria-labelledby="form-heading">
            <h2 id="form-heading" class="card-title">Datos del participante</h2>
            <form>
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" autocomplete="name">
                </div>
                <div class="field">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="18" min="1" max="120">
                </div>
                <div class="field">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="table-wrap">
            <div class="table-header">
                <h2>Stack tecnológico</h2>
                <p>Referencias de backend y frontend del proyecto.</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Backend</th>
                        <th scope="col">Frontend</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="stack-tag stack-tag--be">Node.js</span></td>
                        <td><span class="stack-tag stack-tag--fe">React</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
