<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba F</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0908;
            --bg: #11100e;
            --panel: rgba(22, 21, 19, 0.72);
            --line: rgba(196, 165, 116, 0.22);
            --line-strong: rgba(196, 165, 116, 0.45);
            --gold: #c4a574;
            --gold-light: #dbc9a8;
            --gold-dim: rgba(196, 165, 116, 0.15);
            --text: #ece8e1;
            --text-muted: #9c968c;
            --serif: "Cormorant Garamond", "Times New Roman", serif;
            --sans: "Outfit", system-ui, sans-serif;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            font-weight: 300;
            font-size: 0.9375rem;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg-deep);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 90% 60% at 50% -10%, rgba(196, 165, 116, 0.09), transparent 55%),
                radial-gradient(ellipse 50% 40% at 100% 50%, rgba(196, 165, 116, 0.04), transparent),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 40%, #0d0c0a 100%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: clamp(2.5rem, 8vh, 4.5rem) 1.5rem 5rem;
            animation: reveal 1s var(--ease) both;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .page {
                animation: none;
            }
        }

        .eyebrow {
            display: block;
            margin-bottom: 1rem;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .header h1 {
            margin: 0 0 1rem;
            font-family: var(--serif);
            font-size: clamp(2.75rem, 8vw, 3.75rem);
            font-weight: 400;
            font-style: italic;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: var(--text);
        }

        .header h1 em {
            font-style: normal;
            font-weight: 500;
            color: var(--gold-light);
        }

        .lead {
            margin: 0;
            max-width: 36ch;
            font-size: 0.9375rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .ornament {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2.5rem 0 2.75rem;
            color: var(--line-strong);
        }

        .ornament::before,
        .ornament::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }

        .ornament span {
            font-family: var(--serif);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--gold);
            opacity: 0.85;
        }

        .card {
            padding: 2rem 2rem 2.25rem;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
        }

        .card-title {
            margin: 0 0 2rem;
            font-family: var(--serif);
            font-size: 1.375rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--gold-light);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .field {
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.65rem 0 0.75rem;
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 300;
            color: var(--text);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            transition: border-color 0.35s var(--ease), padding 0.35s var(--ease);
        }

        input::placeholder {
            color: rgba(156, 150, 140, 0.55);
            font-weight: 300;
        }

        input:hover {
            border-bottom-color: var(--line-strong);
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--gold);
            padding-bottom: 0.85rem;
        }

        .field:focus-within label {
            color: var(--gold);
        }

        button[type="submit"] {
            align-self: flex-start;
            margin-top: 0.75rem;
            padding: 0.85rem 2.25rem;
            font-family: var(--sans);
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--bg-deep);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            border: none;
            cursor: pointer;
            transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), filter 0.4s var(--ease);
            box-shadow: 0 8px 32px rgba(196, 165, 116, 0.18);
        }

        button[type="submit"]:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(196, 165, 116, 0.28);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .stack {
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .stack-head {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--line);
        }

        .stack-head h2 {
            margin: 0;
            font-family: var(--serif);
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text);
        }

        .stack-head p {
            margin: 0.35rem 0 0;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 0.875rem 2rem;
            text-align: left;
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 1.25rem 2rem;
            font-family: var(--serif);
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            border-bottom: 1px solid rgba(196, 165, 116, 0.08);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.4s var(--ease);
        }

        tbody tr:hover {
            background: var(--gold-dim);
        }

        td:first-child {
            color: var(--gold-light);
        }

        td:last-child {
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <span class="eyebrow">Registro</span>
            <h1>Prueba <em>F</em></h1>
            <p class="lead">Por favor diligencie el siguiente formulario con sus datos personales.</p>
        </header>

        <div class="ornament" aria-hidden="true"><span>◆</span></div>

        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title" class="card-title">Formulario</h2>
            <form>
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" autocomplete="name">
                </div>
                <div class="field">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Años" min="1" max="120">
                </div>
                <div class="field">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="stack">
            <div class="stack-head">
                <h2>Stack tecnológico</h2>
                <p>Componentes de la arquitectura</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Backend</th>
                        <th scope="col">Frontend</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Node.js</td>
                        <td>React</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
