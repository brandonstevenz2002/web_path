<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba F</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --bg-elevated: #ffffff;
            --surface: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #0d9488;
            --accent-dark: #0f766e;
            --accent-glow: rgba(13, 148, 136, 0.2);
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06),
                      0 20px 40px -12px rgba(15, 23, 42, 0.12);
            --font: "Plus Jakarta Sans", system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 45% at 10% 0%, rgba(13, 148, 136, 0.12), transparent),
                radial-gradient(ellipse 50% 35% at 90% 80%, rgba(99, 102, 241, 0.08), transparent);
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 4rem;
        }

        .header {
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.875rem, 4vw, 2.375rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .lead {
            margin: 0;
            color: var(--text-muted);
            font-size: 1.0625rem;
        }

        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .card-title {
            margin: 0 0 1.25rem;
            padding-bottom: 0.75rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--accent-dark);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 2px solid var(--surface);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:hover {
            border-color: #cbd5e1;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: var(--bg-elevated);
        }

        button[type="submit"] {
            margin-top: 0.25rem;
            padding: 0.9rem 1.5rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button[type="submit"]:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .table-wrap {
            overflow: hidden;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            box-shadow: var(--shadow);
        }

        .table-wrap h2 {
            margin: 0;
            padding: 1.25rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9375rem;
        }

        th {
            padding: 0.75rem 1.75rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            background: var(--bg);
        }

        td {
            padding: 1rem 1.75rem;
            border-top: 1px solid var(--border);
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(13, 148, 136, 0.04);
        }

        .pill {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            font-size: 0.8125rem;
            font-weight: 600;
            border-radius: 999px;
        }

        .pill--backend {
            color: #4338ca;
            background: #eef2ff;
        }

        .pill--frontend {
            color: #0369a1;
            background: #e0f2fe;
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Prueba F</h1>
            <p class="lead">Por favor diligencie el siguiente formulario:</p>
        </header>

        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title" class="card-title">Formulario</h2>
            <form>
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" autocomplete="name">
                </div>
                <div class="field">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Edad" min="1" max="120">
                </div>
                <div class="field">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="table-wrap">
            <h2>Stack</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Backend</th>
                        <th scope="col">Frontend</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="pill pill--backend">Node.js</span></td>
                        <td><span class="pill pill--frontend">React</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
