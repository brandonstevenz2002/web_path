<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>MTTO</title>
    </head>
    <body>
        <h1>Mantenimiento</h1>
        <p>Diligencie el siguiente formulario:</p>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        <br><br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad">
        <br><br>
        <label for="correo">Correo:</label>
        <input type="email" id="correo">
        <br><br>
        <button type="submit">Enviar</button>
        <br><br>
    </form>
    <table border="1">
        <tr>
            <h2>Especialidad</h2>
            <th>Mantenimiento correctivo</th>
            <th>Mantenimiento locativo</th>
        </tr>
        <tr>
            <td>Electrico</td>
            <td>Mecanico</td>
        </tr>
    </table>
    </body>
</html>
