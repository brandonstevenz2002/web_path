<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTTO · Formulario Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============ RESET & VARIABLES ============ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-1: #0a0a1a;
      --bg-2: #0f0d24;
      --glass: rgba(255, 255, 255, 0.045);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --text: #f1f2f9;
      --text-muted: #8a8fa8;
      --accent-1: #8b5cf6;
      --accent-2: #06b6d4;
      --accent-3: #ec4899;
      --success: #10b981;
      --radius-lg: 28px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --ease: cubic-bezier(0.19, 1, 0.22, 1);
    }

    /* ============ BASE ============ */
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      color: var(--text);
      background: var(--bg-1);
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(139, 92, 246, 0.35); color: #fff; }

    /* ============ ANIMATED BACKGROUND ============ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(ellipse at 20% 0%, #1a1340 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 100%, #0d2a3d 0%, transparent 55%),
                  var(--bg-1);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: -1;
      pointer-events: none;
      will-change: transform;
    }
    .orb-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, #7c3aed, transparent 70%);
      top: -140px; left: -120px;
      animation: float1 18s ease-in-out infinite;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      bottom: -160px; right: -100px;
      animation: float2 22s ease-in-out infinite;
    }
    .orb-3 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, #ec4899, transparent 70%);
      top: 45%; left: 60%;
      animation: float3 20s ease-in-out infinite;
      opacity: 0.32;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, 70px) scale(1.15); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-70px, -50px) scale(1.1); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-60px, 60px); }
    }

    /* Subtle grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ============ CARD ============ */
    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 48px 40px 40px;
      border-radius: var(--radius-lg);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.9s var(--ease) both;
      overflow: hidden;
    }

    /* Animated border glow */
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      animation: borderFlow 8s linear infinite;
      opacity: 0.55;
      pointer-events: none;
    }
    @keyframes borderFlow {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ HEADER ============ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.3);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c4b5fd;
      margin-bottom: 20px;
      animation: cardIn 1s var(--ease) both;
      animation-delay: 0.1s;
    }
    .badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-1);
      box-shadow: 0 0 12px var(--accent-1);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #b8b5e0 50%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 34px;
      letter-spacing: 0.005em;
    }

    /* ============ FLOATING LABEL FORM ============ */
    form { display: flex; flex-direction: column; gap: 22px; margin-bottom: 34px; }

    .field {
      position: relative;
    }

    .field input {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      padding: 20px 16px 10px;
      outline: none;
      transition: border-color 0.3s var(--ease),
                  background 0.3s var(--ease),
                  box-shadow 0.3s var(--ease);
    }

    .field input:hover { border-color: rgba(255, 255, 255, 0.2); }

    .field input:focus {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--accent-1);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.13),
                  0 8px 24px -8px rgba(139, 92, 246, 0.4);
    }

    .field label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: all 0.22s var(--ease);
      background: transparent;
      padding: 0 4px;
    }

    /* Floating label states */
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-1);
      background: linear-gradient(180deg, transparent 40%, rgba(15, 13, 36, 0.9) 40%);
    }

    .field input:not(:placeholder-shown):not(:focus) + label {
      color: var(--text-muted);
    }

    /* Remove number spinners */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============ BUTTON ============ */
    .btn {
      position: relative;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #fff;
      cursor: pointer;
      padding: 17px 24px;
      margin-top: 6px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-1) 0%, #6d28d9 50%, var(--accent-2) 100%);
      background-size: 200% 200%;
      box-shadow: 0 12px 30px -10px rgba(139, 92, 246, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 0.3s var(--ease),
                  box-shadow 0.3s var(--ease),
                  background-position 0.6s var(--ease);
    }

    .btn:hover {
      transform: translateY(-3px);
      background-position: 100% 0;
      box-shadow: 0 20px 40px -12px rgba(139, 92, 246, 0.75),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn:active { transform: translateY(-1px); }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.4),
                  0 12px 30px -10px rgba(139, 92, 246, 0.6);
    }

    /* Shine sweep */
    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-22deg);
      transition: left 0.7s var(--ease);
    }
    .btn:hover::after { left: 130%; }

    /* ============ TABLE ============ */
    .table-wrap {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      font-family: 'Sora', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: left;
      padding: 15px 20px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.08);
      border-bottom: 1px solid var(--glass-border);
    }

    tbody td {
      padding: 15px 20px;
      color: #d4d7e6;
      transition: background 0.25s var(--ease);
    }

    tbody td:first-child {
      font-weight: 600;
      color: #a5b4fc;
    }

    tbody tr { transition: background 0.25s var(--ease); }
    tbody tr:hover { background: rgba(139, 92, 246, 0.07); }
    tbody tr:not(:last-child) td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    /* ============ TOAST / SUCCESS ============ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 120%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #6ee7b7;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 20px 40px -12px rgba(16, 185, 129, 0.4);
      transition: transform 0.5s var(--ease), opacity 0.4s var(--ease);
      opacity: 0;
      z-index: 100;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .toast .check {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--success);
      display: grid;
      place-items: center;
      color: #052e1e;
      font-size: 0.8rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 480px) {
      .card { padding: 36px 24px 30px; border-radius: 22px; }
      h1 { font-size: 1.85rem; }
      .subtitle { font-size: 0.88rem; margin-bottom: 28px; }
      thead th, tbody td { padding: 12px 14px; font-size: 0.84rem; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Animated background -->
  <div class="bg-layer"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grain"></div>

  <!-- Card -->
  <main class="card">
    <span class="badge"><span class="dot"></span> Sistema activo</span>

    <h1>Prueba</h1>
    <p class="subtitle">Diligencie el siguiente formulario para continuar.</p>

    <form id="mainForm" novalidate>
      <div class="field">
        <input type="text" id="nombre" name="nombre" placeholder=" " required autocomplete="name">
        <label for="nombre">Nombre completo</label>
      </div>

      <div class="field">
        <input type="number" id="edad" name="edad" placeholder=" " min="0" max="120" required>
        <label for="edad">Edad</label>
      </div>

      <div class="field">
        <input type="email" id="correo" name="correo" placeholder=" " required autocomplete="email">
        <label for="correo">Correo electrónico</label>
      </div>

      <button type="submit" class="btn">Enviar formulario</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Backend</th>
            <th>Frontend</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Node.js</td>
            <td>React</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="check">✓</span>
    <span>Formulario enviado con éxito</span>
  </div>

  <script>
    const form = document.getElementById('mainForm');
    const toast = document.getElementById('toast');
    let toastTimer;

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      clearTimeout(toastTimer);
      toast.classList.add('show');
      form.reset();

      // Volver a ocultar después de 3.5 s
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    });
  </script>
</body>
</html>
