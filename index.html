<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTTO — Mantenimiento test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #f5f5f5;
            --black: #050505;
            --surface: #0f0f0f;
            --surface-raised: #141414;
            --gray-muted: #737373;
            --gray-dim: #404040;
            --line: rgba(255, 255, 255, 0.12);
            --line-strong: rgba(255, 255, 255, 0.28);
            --serif: "Instrument Serif", Georgia, serif;
            --sans: "Inter", system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            font-weight: 400;
            font-size: 0.9375rem;
            line-height: 1.65;
            color: var(--white);
            background: var(--black);
        }

        .layout {
            max-width: 640px;
            margin: 0 auto;
            padding: clamp(2.5rem, 8vh, 4.5rem) 1.5rem 4rem;
        }

        .mark {
            display: inline-block;
            margin-bottom: 2.5rem;
            padding-bottom: 0.75rem;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gray-muted);
            border-bottom: 2px solid var(--white);
        }

        header h1 {
            margin: 0 0 0.65rem;
            font-family: var(--serif);
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.08;
            color: var(--white);
        }

        header p {
            margin: 0 0 2.75rem;
            font-size: 1rem;
            font-weight: 300;
            color: var(--gray-muted);
        }

        .section-rule {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-rule span {
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray-muted);
            white-space: nowrap;
        }

        .section-rule::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .form-panel {
            margin-bottom: 3rem;
            padding: 1.75rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
        }

        form {
            display: grid;
            gap: 1.35rem;
        }

        @media (min-width: 520px) {
            form {
                grid-template-columns: 1fr 1fr;
            }

            .field--wide {
                grid-column: 1 / -1;
            }

            button[type="submit"] {
                grid-column: 1 / -1;
            }
        }

        .field label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gray-muted);
        }

        .field input {
            width: 100%;
            padding: 0.75rem 0;
            font-family: var(--serif);
            font-size: 1.25rem;
            color: var(--white);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            transition: border-color 0.25s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .field input::placeholder {
            color: var(--gray-dim);
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
        }

        .field input:focus {
            outline: none;
            border-bottom-color: var(--white);
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        button[type="submit"] {
            justify-self: start;
            margin-top: 0.5rem;
            padding: 0.85rem 2.25rem;
            font-family: var(--sans);
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--black);
            background: var(--white);
            border: 1px solid var(--white);
            cursor: pointer;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }

        button[type="submit"]:hover {
            background: transparent;
            color: var(--white);
        }

        .stack-wrap {
            border: 1px solid var(--line-strong);
            background: var(--surface);
        }

        .stack-wrap h2 {
            margin: 0;
            padding: 1rem 1.25rem;
            font-family: var(--sans);
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--black);
            background: var(--white);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 0.75rem 1.25rem;
            text-align: left;
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gray-muted);
            background: var(--surface-raised);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 1.15rem 1.25rem;
            font-family: var(--serif);
            font-size: 1.375rem;
            color: var(--white);
            border-bottom: 1px solid var(--line);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--white);
            -webkit-box-shadow: 0 0 0 1000px var(--surface) inset;
            transition: background-color 9999s ease-out;
        }

        th + th,
        td + td {
            border-left: 1px solid var(--line);
        }
    </style>
</head>
<body>
    <div class="layout">
        <span class="mark">MTTO</span>

        <header>
            <h1>Mantenimiento test</h1>
            <p>Diligencie el siguiente formulario</p>
        </header>

        <section class="form-panel" aria-label="Formulario">
            <div class="section-rule"><span>Datos</span></div>
            <form>
                <div class="field field--wide">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name">
                </div>
                <div class="field">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" min="1" max="120">
                </div>
                <div class="field">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" autocomplete="email">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <section class="stack-wrap" aria-labelledby="stack-title">
            <h2 id="stack-title">Stack</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Backend</th>
                        <th scope="col">Frontend</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Node.js</td>
                        <td>React</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
