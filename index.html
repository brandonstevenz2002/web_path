<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #030508;
            --panel: rgba(8, 14, 28, 0.85);
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.35);
            --magenta: #ff00aa;
            --magenta-dim: rgba(255, 0, 170, 0.3);
            --violet: #7b61ff;
            --text: #e8f4ff;
            --muted: #6b8fad;
            --grid: rgba(0, 240, 255, 0.06);
            --font-display: "Orbitron", sans-serif;
            --font-mono: "Share Tech Mono", monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-mono);
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--text);
            background: var(--void);
            overflow-x: hidden;
        }

        /* Animated cyber grid */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.03) 50%, transparent 100%),
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(123, 97, 255, 0.2), transparent 55%),
                radial-gradient(ellipse 40% 30% at 100% 80%, rgba(255, 0, 170, 0.12), transparent);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent);
            animation: grid-drift 20s linear infinite;
        }

        @keyframes grid-drift {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(48px); }
        }

        .scanline {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
            opacity: 0.4;
        }

        .glow-orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb--1 {
            top: -120px;
            left: -80px;
            background: var(--cyan);
            opacity: 0.15;
            animation: pulse-orb 6s ease-in-out infinite;
        }

        .glow-orb--2 {
            bottom: -100px;
            right: -60px;
            background: var(--magenta);
            opacity: 0.12;
            animation: pulse-orb 8s ease-in-out infinite reverse;
        }

        @keyframes pulse-orb {
            0%, 100% { transform: scale(1); opacity: 0.12; }
            50% { transform: scale(1.15); opacity: 0.2; }
        }

        .shell {
            position: relative;
            z-index: 2;
            max-width: 680px;
            margin: 0 auto;
            padding: clamp(2rem, 6vw, 3.5rem) 1.25rem 4rem;
        }

        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 0.5rem 0;
            font-size: 0.6875rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--cyan-dim);
        }

        .hud-bar .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--cyan);
        }

        .hud-bar .status::before {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--cyan);
            box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
            animation: blink 2s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .header h1 {
            margin: 0 0 0.75rem;
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1.2;
            text-shadow:
                0 0 20px var(--cyan-dim),
                0 0 40px rgba(0, 240, 255, 0.2);
            background: linear-gradient(90deg, var(--text) 0%, var(--cyan) 50%, var(--magenta) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 8s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .header .lead {
            margin: 0;
            color: var(--muted);
            padding-left: 0.75rem;
            border-left: 2px solid var(--magenta);
        }

        .panel {
            position: relative;
            margin: 2rem 0;
            padding: 1px;
            background: linear-gradient(135deg, var(--cyan), var(--violet), var(--magenta));
            clip-path: polygon(
                0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px,
                100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px)
            );
            box-shadow:
                0 0 30px var(--cyan-dim),
                inset 0 0 60px rgba(0, 240, 255, 0.03);
        }

        .panel-inner {
            padding: 1.75rem clamp(1.25rem, 4vw, 2rem);
            background: var(--panel);
            backdrop-filter: blur(16px);
            clip-path: polygon(
                0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px,
                100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px)
            );
        }

        .panel-tag {
            position: absolute;
            top: -0.65rem;
            left: 1.5rem;
            padding: 0.2rem 0.75rem;
            font-family: var(--font-display);
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--void);
            background: var(--cyan);
            box-shadow: 0 0 20px var(--cyan);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.35rem;
        }

        .field {
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-family: var(--font-display);
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--cyan);
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--text);
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid var(--cyan-dim);
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        input::placeholder {
            color: rgba(107, 143, 173, 0.6);
        }

        .field::before {
            content: "›";
            position: absolute;
            left: 1rem;
            bottom: 0.85rem;
            color: var(--magenta);
            font-size: 1.1rem;
            pointer-events: none;
        }

        input:hover {
            border-color: rgba(0, 240, 255, 0.55);
            background: rgba(0, 240, 255, 0.07);
        }

        input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow:
                0 0 0 1px var(--cyan),
                0 0 24px var(--cyan-dim),
                inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        button[type="submit"] {
            position: relative;
            margin-top: 0.5rem;
            padding: 1rem 2rem;
            font-family: var(--font-display);
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--void);
            background: linear-gradient(90deg, var(--cyan), #00c8d4);
            border: none;
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 30px var(--cyan-dim);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            overflow: hidden;
        }

        button[type="submit"]::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        button[type="submit"]:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        button[type="submit"]:hover::after {
            transform: translateX(100%);
        }

        .stack-block {
            margin-top: 2.5rem;
        }

        .stack-block h2 {
            margin: 0 0 1rem;
            font-family: var(--font-display);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--magenta);
            text-shadow: 0 0 20px var(--magenta-dim);
        }

        .data-table-wrap {
            position: relative;
            padding: 1px;
            background: linear-gradient(90deg, var(--magenta-dim), var(--cyan-dim));
        }

        .data-table-wrap::before {
            content: "SYS.DATA // READONLY";
            position: absolute;
            top: -1.4rem;
            right: 0;
            font-size: 0.625rem;
            letter-spacing: 0.15em;
            color: var(--muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            backdrop-filter: blur(12px);
        }

        th {
            padding: 0.875rem 1.25rem;
            text-align: left;
            font-family: var(--font-display);
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.06);
            border-bottom: 1px solid var(--cyan-dim);
        }

        td {
            padding: 1rem 1.25rem;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
            transition: background 0.2s, text-shadow 0.2s;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: rgba(255, 0, 170, 0.06);
            text-shadow: 0 0 12px var(--cyan-dim);
        }

        td:first-child {
            color: #7dff9a;
        }

        td:last-child {
            color: var(--cyan);
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-grid,
            .glow-orb,
            .header h1,
            .hud-bar .status::before {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg-grid"></div>
    </div>
    <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--2" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <div class="shell">
        <div class="hud-bar">
            <span>Prueba // v1.0</span>
            <span class="status">Sistema en línea</span>
        </div>

        <header class="header">
            <h1>Prueba #1 programa</h1>
            <p class="lead">Digite el siguiente formulario por favor:</p>
        </header>

        <section class="panel" aria-labelledby="form-access">
            <span class="panel-tag" id="form-access">Input</span>
            <div class="panel-inner">
                <form>
                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="IDENT_NOMBRE" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="000" min="1" max="120">
                    </div>
                    <div class="field">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="user@node.sys" autocomplete="email">
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>

        <section class="stack-block" aria-labelledby="stack-title">
            <h2 id="stack-title">Stack tecnologico</h2>
            <div class="data-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Backend</th>
                            <th scope="col">Frontend</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Node.js</td>
                            <td>React</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
