<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bienvenido — Programa de mantenimiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0c1929;
            --navy-mid: #132337;
            --navy-light: #1a3048;
            --surface: #f4f7fb;
            --white: #ffffff;
            --text: #0f1c2e;
            --text-on-dark: #e8eef4;
            --muted: #5a6b7d;
            --muted-on-dark: #94a8bc;
            --accent: #0284c7;
            --accent-bright: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.12);
            --amber: #f59e0b;
            --border: #dce4ed;
            --radius: 12px;
            --radius-lg: 20px;
            --shadow: 0 1px 2px rgba(12, 25, 41, 0.06),
                      0 16px 48px rgba(12, 25, 41, 0.1);
            --sans: "IBM Plex Sans", system-ui, sans-serif;
            --serif: "IBM Plex Serif", Georgia, serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            background: var(--surface);
        }

        .hero {
            background: linear-gradient(145deg, var(--navy) 0%, var(--navy-mid) 50%, #0f2840 100%);
            color: var(--text-on-dark);
            padding: clamp(2.5rem, 6vw, 4rem) 1.5rem clamp(3rem, 8vw, 5rem);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
                radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.08), transparent 40%);
            pointer-events: none;
        }

        .hero::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-bright), var(--amber), var(--accent-bright));
            opacity: 0.7;
        }

        .hero-inner {
            position: relative;
            max-width: 720px;
            margin: 0 auto;
        }

        .welcome {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.35rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent-bright);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 999px;
        }

        .welcome::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }

        .hero h1 {
            margin: 0 0 0.75rem;
            font-family: var(--serif);
            font-size: clamp(1.75rem, 4.5vw, 2.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .hero .lead {
            margin: 0;
            max-width: 42ch;
            font-size: 1.0625rem;
            font-weight: 400;
            color: var(--muted-on-dark);
        }

        .layout {
            max-width: 720px;
            margin: -2.5rem auto 0;
            padding: 0 1.5rem 4rem;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: clamp(1.5rem, 4vw, 2rem);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .card-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            font-size: 1.25rem;
            background: var(--accent-soft);
            border-radius: var(--radius);
            color: var(--accent);
        }

        .card-header h2 {
            margin: 0 0 0.25rem;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .card-header p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 1.25rem;
        }

        @media (min-width: 540px) {
            form {
                grid-template-columns: 1fr 1fr;
            }

            .field--full {
                grid-column: 1 / -1;
            }

            button[type="submit"] {
                grid-column: 1 / -1;
                justify-self: start;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:hover {
            border-color: #b8c5d4;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--white);
        }

        button[type="submit"] {
            margin-top: 0.25rem;
            padding: 0.85rem 2rem;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--white);
            background: linear-gradient(180deg, var(--accent) 0%, #0369a1 100%);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .stack-section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .stack-section h2 {
            margin: 0;
            padding: 1.25rem 1.75rem;
            font-family: var(--serif);
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(180deg, var(--navy-light) 0%, var(--navy-mid) 100%);
            color: var(--text-on-dark);
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9375rem;
        }

        th {
            padding: 0.875rem 1.75rem;
            text-align: left;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.125rem 1.75rem;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: var(--accent-soft);
        }

        .tech {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tech-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .tech-dot--be {
            background: #22c55e;
        }

        .tech-dot--fe {
            background: var(--accent-bright);
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <span class="welcome">Bienvenido</span>
            <h1>Programa de mantemenimiento</h1>
            <p class="lead">Antes de contactarnos diligencie este formato.</p>
        </div>
    </header>

    <div class="layout">
        <main>
            <section class="card" aria-labelledby="form-heading">
                <div class="card-header">
                    <div class="card-icon" aria-hidden="true">✎</div>
                    <div>
                        <h2 id="form-heading">Formato de contacto</h2>
                        <p>Complete sus datos para continuar.</p>
                    </div>
                </div>
                <form>
                    <div class="field field--full">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Años" min="1" max="120">
                    </div>
                    <div class="field">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </section>

            <section class="stack-section" aria-labelledby="stack-heading">
                <h2 id="stack-heading">Stack tecnologico</h2>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Backend</th>
                                <th scope="col">Frontend</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <span class="tech">
                                        <span class="tech-dot tech-dot--be" aria-hidden="true"></span>
                                        Node.js
                                    </span>
                                </td>
                                <td>
                                    <span class="tech">
                                        <span class="tech-dot tech-dot--fe" aria-hidden="true"></span>
                                        React
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
