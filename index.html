<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --space: #05060a;
            --space-mid: #0c0f18;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f0f3fa;
            --muted: #8b95a8;
            --ice: #a5d8ff;
            --electric: #5b8def;
            --violet: #9d7cff;
            --mint: #5eead4;
            --radius: 20px;
            --font-head: "Syne", sans-serif;
            --font-body: "Exo 2", sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 1rem;
            line-height: 1.65;
            color: var(--text);
            background: var(--space);
        }

        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora span {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: float 18s ease-in-out infinite;
        }

        .aurora span:nth-child(1) {
            width: 55vw;
            height: 55vw;
            max-width: 520px;
            max-height: 520px;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, var(--electric), transparent 70%);
        }

        .aurora span:nth-child(2) {
            width: 45vw;
            height: 45vw;
            max-width: 420px;
            max-height: 420px;
            top: 40%;
            right: -15%;
            background: radial-gradient(circle, var(--violet), transparent 70%);
            animation-delay: -6s;
        }

        .aurora span:nth-child(3) {
            width: 35vw;
            height: 35vw;
            max-width: 320px;
            max-height: 320px;
            bottom: -10%;
            left: 25%;
            background: radial-gradient(circle, var(--mint), transparent 70%);
            opacity: 0.25;
            animation-delay: -12s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(3%, 2%) scale(1.05); }
            66% { transform: translate(-2%, -3%) scale(0.98); }
        }

        .frame {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
            padding: clamp(2rem, 7vh, 4rem) 1.25rem 4rem;
        }

        .chip {
            display: inline-block;
            margin-bottom: 1.25rem;
            padding: 0.35rem 0.9rem;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ice);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            backdrop-filter: blur(12px);
        }

        header h1 {
            margin: 0 0 0.5rem;
            font-family: var(--font-head);
            font-size: clamp(2.25rem, 7vw, 3.25rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            background: linear-gradient(135deg, #fff 0%, var(--ice) 45%, var(--violet) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            margin: 0 0 2.25rem;
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--muted);
        }

        .glass-card {
            padding: 1.75rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            margin-bottom: 1.75rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        input::placeholder {
            color: rgba(139, 149, 168, 0.65);
        }

        input:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        input:focus {
            outline: none;
            border-color: rgba(91, 141, 239, 0.6);
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15);
        }

        button[type="submit"] {
            margin-top: 0.35rem;
            padding: 0.95rem 1.5rem;
            font-family: var(--font-head);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--space);
            background: linear-gradient(135deg, var(--ice) 0%, var(--electric) 50%, var(--violet) 100%);
            background-size: 150% 150%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s, background-position 0.4s;
            box-shadow: 0 8px 32px rgba(91, 141, 239, 0.35);
        }

        button[type="submit"]:hover {
            background-position: 100% 50%;
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(157, 124, 255, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .data-panel {
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
        }

        th {
            padding: 0.85rem 1.25rem;
            text-align: left;
            font-family: var(--font-head);
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 1.1rem 1.25rem;
            font-size: 0.9375rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(91, 141, 239, 0.08);
        }

        .stack-name {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stack-name::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        td:first-child .stack-name {
            color: var(--mint);
        }

        td:first-child .stack-name::before {
            background: var(--mint);
        }

        td:last-child .stack-name {
            color: var(--ice);
        }

        td:last-child .stack-name::before {
            background: var(--ice);
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora span {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="frame">
        <header>
            <span class="chip">Interfaz 2040</span>
            <h1>TITULO</h1>
            <p>Parrafo</p>
        </header>

        <section class="glass-card" aria-label="Formulario">
            <form>
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name">
                </div>
                <div class="field">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Edad" min="1" max="120">
                </div>
                <div class="field">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="data-panel">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Backend</th>
                        <th scope="col">Frontend</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="stack-name">Node.js</span></td>
                        <td><span class="stack-name">React</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
