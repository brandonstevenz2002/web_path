<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTTO — CH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #050505;
      --ink: #0c0c0c;
      --paper: #f2efe8;
      --chrome-1: #e8e8ea;
      --chrome-2: #9a9da3;
      --chrome-3: #5c5f66;
      --line: rgba(242, 239, 232, 0.22);
      --line-strong: rgba(242, 239, 232, 0.45);
      --font-gothic: "Cinzel Decorative", "Cinzel", serif;
      --font-serif: "Cinzel", serif;
      --font-body: "Libre Baskerville", Georgia, serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.65;
      color: var(--paper);
      background:
        radial-gradient(ellipse 90% 50% at 50% -5%, rgba(154, 157, 163, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(92, 95, 102, 0.08), transparent 45%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.015) 2px,
          rgba(255, 255, 255, 0.015) 3px
        ),
        var(--black);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) 1.5rem 3.5rem;
    }

    .frame {
      position: relative;
      padding: clamp(2rem, 5vw, 2.75rem);
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, rgba(12, 12, 12, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 1),
        inset 0 1px 0 rgba(232, 232, 234, 0.06),
        0 24px 80px rgba(0, 0, 0, 0.9);
    }

    .frame::before,
    .frame::after {
      content: "✠";
      position: absolute;
      font-size: 0.75rem;
      color: var(--chrome-2);
      opacity: 0.7;
    }

    .frame::before {
      top: 0.65rem;
      left: 50%;
      transform: translateX(-50%);
    }

    .frame::after {
      bottom: 0.65rem;
      left: 50%;
      transform: translateX(-50%);
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--chrome-2);
      border-style: solid;
      opacity: 0.6;
    }

    .corner--tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner--tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .corner--bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .corner--br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-family: var(--font-gothic);
      font-weight: 900;
      font-size: clamp(2.4rem, 8vw, 3.5rem);
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      background: linear-gradient(
        180deg,
        var(--chrome-1) 0%,
        var(--chrome-2) 45%,
        var(--chrome-3) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8));
    }

    .tagline {
      margin: 1rem 0 0;
      font-family: var(--font-serif);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--chrome-2);
    }

    .intro {
      margin: 0 0 1.75rem;
      text-align: center;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(242, 239, 232, 0.75);
    }

    .intro::before {
      content: "— ";
      color: var(--chrome-3);
    }

    .intro::after {
      content: " —";
      color: var(--chrome-3);
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-family: var(--font-serif);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--chrome-2);
    }

    .section-label::before,
    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    }

    form {
      margin-bottom: 2.5rem;
    }

    .field {
      margin-bottom: 1.35rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: var(--font-serif);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--chrome-2);
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--paper);
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input::placeholder {
      color: rgba(154, 157, 163, 0.45);
      font-style: italic;
    }

    input:hover {
      border-color: var(--line-strong);
    }

    input:focus {
      border-color: var(--chrome-2);
      box-shadow:
        inset 0 0 0 1px rgba(232, 232, 234, 0.08),
        0 0 0 1px var(--chrome-3);
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 1rem 1.5rem;
      font-family: var(--font-gothic);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      text-transform: uppercase;
      color: var(--black);
      cursor: pointer;
      border: 1px solid var(--chrome-1);
      background: linear-gradient(
        180deg,
        var(--chrome-1) 0%,
        var(--chrome-2) 50%,
        var(--chrome-3) 100%
      );
      box-shadow: 0 4px 0 #2a2a2c, 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }

    button[type="submit"]:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2a2a2c;
    }

    .table-wrap {
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 0.9rem 1rem;
      font-family: var(--font-serif);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--black);
      background: linear-gradient(180deg, var(--chrome-1), var(--chrome-2));
      border-bottom: 1px solid var(--chrome-3);
    }

    td {
      padding: 1rem;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    tbody tr:hover td {
      background: rgba(232, 232, 234, 0.04);
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--chrome-3);
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <article class="frame">
      <span class="corner corner--tl" aria-hidden="true"></span>
      <span class="corner corner--tr" aria-hidden="true"></span>
      <span class="corner corner--bl" aria-hidden="true"></span>
      <span class="corner corner--br" aria-hidden="true"></span>

      <header>
        <h1 class="brand">MTTO</h1>
        <p class="tagline">Handmade · Silver · Gothic</p>
      </header>

      <p class="intro">Diligencie el siguiente formulario</p>

      <p class="section-label">Registro</p>

      <form action="#" method="post">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Enter name">
        </div>
        <div class="field">
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Age">
        </div>
        <div class="field">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" autocomplete="email" placeholder="your@email.com">
        </div>
        <button type="submit">Enviar</button>
      </form>

      <p class="section-label">Stack</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Backend</th>
              <th scope="col">Frontend</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Node.js</td>
              <td>React</td>
            </tr>
          </tbody>
        </table>
      </div>
    </article>

    <footer>Est. MMXXVI · Los Angeles</footer>
  </main>
</body>
</html>
